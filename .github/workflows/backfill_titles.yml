name: Backfill patent title translations (run once, then delete)

on:
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run title backfill
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python fetchers/backfill_titles.py

      - name: Commit updated patents
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/patents.json
          git stash
          git pull --rebase origin main
          git stash pop
          git add data/patents.json
          git diff --staged --quiet || git commit -m "chore: backfill English patent title translations [one-time]"
          git push
